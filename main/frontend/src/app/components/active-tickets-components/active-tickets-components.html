<div class="active-tickets-container">
    <table class="ticket-list-container">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Agent Name</th>
            <th>Agent IT Name</th>
        </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ticket of data">
                <td>{{ ticket.id }}</td>
                <td class="title-cell">{{ ticket.title }}</td>
                <td class="desc-cell">{{ ticket.description }}</td>
                <td>
                <span class="status" [ngClass]="ticket.status.toLowerCase()">
                    {{ ticket.status }}
                </span>
                </td>
                <td>
                <span class="priority" [ngClass]="ticket.priority.toLowerCase()">
                    {{ ticket.priority }}
                </span>
                </td>
                <td>{{ ticket.user.name }}</td>
                <td>{{ ticket.agent.name }}</td>
            </tr>
            </tbody>
        
    </table>
</div>
