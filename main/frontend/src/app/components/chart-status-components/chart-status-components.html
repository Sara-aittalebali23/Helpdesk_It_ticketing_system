<div *ngIf="barChartData.length > 0; else noData">
    <canvas baseChart
            [datasets]="barChartData"
            [labels]="barChartLabels"
            [options]="barChartOptions"
            [type]="barChartType">
    </canvas>
  </div>
  <ng-template #noData>
    <p>Loading chart data...</p>
  </ng-template>
