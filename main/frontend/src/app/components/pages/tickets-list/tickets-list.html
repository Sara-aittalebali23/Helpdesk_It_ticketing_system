<div class="tickets-list-container">
    <div class="table-header">
        <!-- Search Bar -->
        <input
            type="text"
            class="search-bar"
            placeholder="Search tickets..."
            />
            <!-- [(ngModel)]="searchQuery"
            (input)="onSearch()" -->

        <!-- Filter by Status -->
        <select class="filter-dropdown" >
        <!-- [(ngModel)]="selectedStatus" (change)="onFilter()" -->
            <option value="">All Statuses</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
        </select>

        <!-- Filter by Priority -->
        <select class="filter-dropdown" >
        <!-- [(ngModel)]="selectedPriority" (change)="onFilter()" -->
            <option value="">All Priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
        </select>
        <button class="search-btn">Search</button>
    </div>

    <div class="table-wrapper">
    <table class="ticket-list-container">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Agent Name</th>
            <th>Agent IT Name</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let ticket of data">
            <td>{{ ticket.id }}</td>
            <td class="title-cell">{{ ticket.title }}</td>
            <td class="desc-cell">{{ ticket.description }}</td>
            <td>
            <span class="status" [ngClass]="ticket.status.toLowerCase()">
                {{ ticket.status }}
            </span>
            </td>
            <td>
            <span class="priority" [ngClass]="ticket.priority.toLowerCase()">
                {{ ticket.priority }}
            </span>
            </td>
            <td>{{ ticket.user.name }}</td>
            <td>{{ ticket.agent.name }}</td>
        </tr>
        </tbody>
    </table>
    </div>
</div>
